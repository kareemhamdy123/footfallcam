# Example configuration for a single-entrance retail store camera.
# Coordinates are in pixels of the SOURCE video resolution - draw your own
# with tools/draw_zones.py (see README) after pointing `source` at your feed.

source: "data/videoplayback 2.mp4"     # file path, RTSP/HTTP URL, or webcam index e.g. "0"
output_dir: "outputs"
night_mode: "auto"            # off | on | auto  (#19 Night vision mode)
heatmap_decay: 0.0            # 0 = cumulative for the whole session

detection:
  model_path: "yolov8n.pt"    # any Ultralytics YOLO checkpoint
  confidence: 0.35
  device: "cpu"                # "cpu", "cuda:0", "mps", ...
  person_class_id: 0           # COCO class id for "person"

behaviour:
  dwell_alert_seconds: 600     # flag visitors who stay > 10 min (#20)
  queue_min_people: 2          # (#2/#3)
  queue_max_gap_px: 120
  group_max_distance_px: 80    # (#14 Group counting)
  safe_occupancy_limit: 50     # (#15)

staff_exclusion:               # (#12) staff wear a magenta tag/lanyard
  hsv_lower: [140, 80, 80]
  hsv_upper: [170, 255, 255]

# (#13 Multiple counting line) - each line is tallied independently.
lines:
  - name: "outside_sidewalk"
    p1: [0, 40]
    p2: [640, 40]
    in_direction: "top_to_bottom"   # (#8 Outside traffic, feeds #9 Turn-in rate)

  - name: "main_entrance"
    p1: [0, 380]
    p2: [640, 380]
    in_direction: "top_to_bottom"   # crossing downward = entering the store

# (#17 Zone counting, #2/#3 Queue, #10 Sales conversation, #15 Safe occupancy)
zones:
  - name: "checkout_queue"
    kind: "queue"
    polygon: [[420, 200], [630, 200], [630, 380], [420, 380]]

  - name: "checkout_counter"
    kind: "sales"
    polygon: [[420, 150], [630, 150], [630, 200], [420, 200]]

  - name: "sales_floor"
    kind: "safe_occupancy"
    polygon: [[0, 60], [640, 60], [640, 380], [0, 380]]

  - name: "electronics_aisle"
    kind: "generic"
    polygon: [[0, 60], [200, 60], [200, 380], [0, 380]]
