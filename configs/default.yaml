# FootfallCam-CV default configuration.
#
# This file is the single source of truth for every tunable (R3).
# Code must never hardcode coordinates, thresholds or model paths.
#
# Coordinate convention: every point is NORMALISED to 0.0-1.0 and scaled to
# the frame resolution at runtime, so one config works at any video size.

source: "data/sample.mp4"
output_dir: "outputs"

detection:
  model_path: "yolov8n.onnx"
  confidence: 0.45
  device: "gpu"            # "gpu" (DirectML/CUDA auto) | "cpu"
  person_class_id: 0
  input_size: 640          # letterbox square edge; must match the ONNX export
  nms_iou: 0.45
  # Geometric sanity filters - reject noise, poles and counter-edge strips.
  sanity:
    min_box_width_px: 12
    min_box_height_px: 16
    min_height_over_width: 0.30
    min_width_over_height: 0.15
    max_frame_fraction: 0.95

tracking:
  iou_threshold: 0.30
  high_confidence_threshold: 0.45
  min_hits: 2               # a track needs 2 matched frames to be confirmed
  max_missed: 30            # frames a track survives without a detection
  max_center_distance_px: 90
  max_occlusion_bridge: 2   # frames a confirmed track is carried on prediction
  box_ema_alpha: 0.70       # bounding-box smoothing
  velocity_ema_alpha: 0.60  # velocity smoothing
  max_history: 300          # retained foot-point trail length

behaviour:
  dwell_alert_seconds: 60
  safe_occupancy_limit: 30
  queue_min_people: 2
  queue_max_gap_px: 120

counting:
  # Co-movement clustering radius for GroupCounter.
  group_max_distance_px: 90
  # Group entry events closer together in time than this are one purchasing unit.
  group_entry_window_s: 3.0
  # Auto mode (used when no lines are configured): a track that vanishes is
  # only counted OUT after this many consecutive missing frames, so a brief
  # detection dropout is not mistaken for an exit.
  auto_mode:
    missing_frame_debounce: 8
    # A track that both appeared and vanished inside the frame border margin
    # and stayed shorter than this is treated as a passerby, not a visitor.
    passerby_margin_fraction: 0.10
    passerby_max_seconds: 3.2

# Brochure characteristic 6.
#
# OFF BY DEFAULT, deliberately. Inferring gender from a low-resolution
# surveillance crop of a stranger is unreliable and carries real privacy and
# bias consequences; the model-less fallback is a weak multi-cue guess, not
# evidence. Enable it only with a trained model, only where lawful, and only
# if you have validated it on your own floor. See the ethics section of the
# README before switching this on.
demographics:
  enabled: false
  model_path: null          # ONNX model; null uses the heuristic fallback
  min_hits: 3               # do not classify a track before it is this settled
  # Heuristic only: below this agreement between cues the answer is "unknown"
  # rather than a coin flip. 0.60 makes the model-less fallback abstain on
  # essentially every real crop, which is the intended behaviour - see the
  # measured table at the top of features/gender.py before lowering it.
  heuristic_min_confidence: 0.60

lines:
  - name: "main_entrance"
    p1: [0.05, 0.50]
    p2: [0.95, 0.50]
    in_direction: "top_to_bottom"

# Polygons tinted on the annotated output. Rendering arrives in Phase 4; the
# features that *reason* about zones (area profiling, zone headcounts) are
# Phase 5. kind selects the tint: generic | queue | sales | safe_occupancy |
# outside.
zones:
  - name: "sales_floor"
    kind: "sales"
    polygon: [[0.30, 0.05], [0.72, 0.05], [0.72, 0.45], [0.30, 0.45]]
  - name: "entrance_lane"
    kind: "queue"
    polygon: [[0.02, 0.55], [0.30, 0.55], [0.30, 0.98], [0.02, 0.98]]
